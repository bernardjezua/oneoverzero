<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      This is the template for every page. The build fills in the __TOKENS__ below for each page listed in
      src/pageMeta.js and writes one HTML file per page, so edit the text there, not here.
    -->
    <title>__TITLE__</title>
    <meta name="description" content="__DESCRIPTION__" />
    <!--__ROBOTS__-->
    <!--__CANONICAL__-->
    <meta name="theme-color" content="#0a0630" />
    <!--share:start-->
    <!-- Link preview (thumbnail). Social sites need absolute URLs, so __SITE_URL__ becomes the Vercel address at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="One Over Zero Innovations" />
    <meta property="og:locale" content="en_PH" />
    <meta property="og:title" content="__TITLE__" />
    <meta property="og:description" content="__SHARE__" />
    <meta property="og:url" content="__URL__" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="One Over Zero Innovations logo on a purple background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__TITLE__" />
    <meta name="twitter:description" content="__SHARE__" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <!--share:end-->
    <!--__JSONLD__-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Montserrat:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
